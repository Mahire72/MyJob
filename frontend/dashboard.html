<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

    <!-- CSS-->
    <link rel="stylesheet" href="css/stylesheet_dashboard.css">
</head>

<body>
    <div class="header">
        <h1>My Jobs</h1>

        <!-- profile bouton-->
        <button onclick="goToProfile()">Profile</button>
    </div>

    <div class="welcome">
        <div class="welcome-title">Bon retour, <span id="welcomeName">____</span></div>
        <div class="welcome-subtitle">Voici les offres recommandées selon ton profil.</div>
    </div>

    <div class="container">
        <div class="sidebar">
            <h3>Liste de jobs</h3>
            <div id="jobList"></div>
        </div>

        <!-- Hub de détails (remplace la carte) -->
        <div class="content">
            <div id="jobDetails">
                <h3 id="jobDetailsTitle">Détails de l'offre</h3>
                <p id="jobDetailsHint">Clique sur une offre à gauche pour voir les détails ici.</p>
                <div id="jobDetailsBody"></div>
            </div>
        </div>
    </div>

    <script src="js/dashboard.js"></script>
</body>

</html>
