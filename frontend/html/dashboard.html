<!DOCTYPE html>
<html lang="fr">
<head>
     <link rel="stylesheet_dashboard" href="./css/stylesheet_dashboard.css">
    <meta charset="UTF-8">
    <title>My Dream Job Dashboard</title>
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>

<body>
    <div class="header">
        <h1>My Dream Job Dashboard</h1>
        <div class="search-box">
            <input id="keyword" placeholder="Métier">
            <input id="location" placeholder="Ville">
            <button onclick="searchJobs()">Rechercher</button>
        </div>
    </div>

    <div class="main">
        <div id="results" class="results"></div>
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>
    var map = L.map('map').setView([46.6, 2.5], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    </script>
</body>
</html>
