<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Se connecter</title>
    <link rel="stylesheet" href="css/stylesheet_se_connecter.css">
</head>

<body>
<div class="login-page">
    <div class="login-box">
        <h2>Se connecter</h2>
        <p class="login-subtitle">Accède à ton espace MyJob avec ton e-mail et ton mot de passe.</p>

        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="username" placeholder="exemple@email.com"/>

        <label for="password">Mot de passe</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••"/>

        <button type="button" onclick="login()">Connexion</button>

        <div class="login-footer">
            <a href="creer_compte.html">Pas encore de compte ? Créer un compte</a>
        </div>
    </div>
</div>

<script src="js/login.js"></script>
</body>
</html>
